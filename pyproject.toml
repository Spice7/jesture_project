[project]
name = "jesture-project"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=6.26.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "mediapipe>=1.0.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "tensorflow>=2.21.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ultralytics>=8.4.138",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
